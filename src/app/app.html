<header>
  <nav class="navbar navbar-expand bg-body-tertiary border-bottom" aria-label="Main">
    <div class="container-fluid flex-wrap gap-2">
      <a routerLink="/" class="navbar-brand d-flex align-items-center gap-2">
        <img src="images/booklogo.png" alt="" height="64" class="d-inline-block" />
        Flash Card Multiple
      </a>
      <ul class="navbar-nav flex-wrap me-auto">
        @for (link of links(); track link.path) {
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="link.path"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: link.exact }"
              >{{ link.label }}</a
            >
          </li>
        }
        @if (user()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/logout">Log out</a>
          </li>
        }
      </ul>
      <div class="d-flex align-items-center gap-3">
        @if (user(); as u) {
          <span class="navbar-text py-0"
            >Logged in as <span class="fw-semibold text-body">{{ u.displayName }}</span></span
          >
        }
        <button
          type="button"
          class="btn btn-sm btn-outline-primary d-flex align-items-center"
          [attr.aria-pressed]="isDark()"
          [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
          (click)="theme.toggle()"
        >
          @if (isDark()) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <circle cx="12" cy="12" r="5" />
              <path
                d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                fill="none"
              />
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          }
        </button>
      </div>
    </div>
  </nav>
</header>
<main class="container py-4">
  <router-outlet />
</main>
