<div class="col-12 col-md-9 col-lg-6 mx-auto">
  <h1 class="mb-3">Register</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label for="register-display-name" class="form-label">Display name</label>
      <input
        id="register-display-name"
        type="text"
        class="form-control"
        formControlName="displayName"
        placeholder="Enter Display Name"
        autocomplete="nickname"
        maxlength="50"
      />
    </div>
    <div class="mb-3">
      <label for="register-email" class="form-label">Registration email</label>
      <input
        id="register-email"
        type="email"
        class="form-control"
        formControlName="email"
        placeholder="Enter Email"
        autocomplete="email"
      />
    </div>
    <div class="mb-3">
      <label for="register-password" class="form-label">Create password</label>
      <input
        id="register-password"
        type="password"
        class="form-control"
        formControlName="password"
        placeholder="Enter Password"
        autocomplete="new-password"
        aria-describedby="register-password-help"
      />
      <div id="register-password-help" class="form-text">
        8–100 characters, with at least one letter and one digit.
      </div>
    </div>
    <div class="mb-3">
      <label for="register-confirm-password" class="form-label">Confirm password</label>
      <input
        id="register-confirm-password"
        type="password"
        class="form-control"
        formControlName="confirmPassword"
        placeholder="Confirm Password"
        autocomplete="new-password"
      />
    </div>
    <div class="d-flex justify-content-end">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Register</button>
    </div>
  </form>
</div>
